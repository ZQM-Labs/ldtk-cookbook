name: Example contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
